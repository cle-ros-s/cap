<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheme Details - Government Scheme Recommendation System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-gov">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-bank2"></i></div>
                <div>GovScheme</div>
            </a>
            <div id="nav-auth-section" class="d-flex align-items-center gap-2"></div>
        </div>
    </nav>

    <!-- CONTENT -->
    <section class="py-5" id="detail-container">
        <div class="container text-center py-5">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 text-muted">Loading scheme details...</p>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-gov">
        <div class="container text-center small text-muted">
            &copy; 2026 Government Scheme Recommendation System
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const schemeId = urlParams.get('id');

            if (!schemeId) {
                window.location.href = 'schemes.html';
                return;
            }

            try {
                const scheme = await apiFetch(`/schemes/${schemeId}`);
                renderSchemeDetail(scheme);
            } catch (err) {
                document.getElementById('detail-container').innerHTML = `
                    <div class="container alert alert-danger p-4 text-center">
                        <h4>Error Loading Scheme</h4>
                        <p>${err.message}</p>
                        <a href="schemes.html" class="btn btn-primary mt-2">Back to Schemes</a>
                    </div>
                `;
            }
        });

        function renderSchemeDetail(scheme) {
            const container = document.getElementById('detail-container');

            let docsHtml = scheme.requiredDocuments && scheme.requiredDocuments.length > 0 ?
                scheme.requiredDocuments.map(d => `
                    <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <div>
                            <div class="fw-bold">${d.documentName}</div>
                            <div class="small text-muted">${d.description || ''}</div>
                        </div>
                        <span class="badge ${d.mandatory ? 'bg-danger' : 'bg-secondary'}">${d.mandatory ? 'Mandatory' : 'Optional'}</span>
                    </li>
                `).join('') : '<p class="text-muted">No specific documents specified.</p>';

            let stepsHtml = scheme.applicationProcedures && scheme.applicationProcedures.length > 0 ?
                scheme.applicationProcedures.map(p => `
                    <div class="d-flex gap-3 mb-3">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:36px; height:36px; font-weight:700;">${p.stepNumber}</div>
                        <div class="pt-1">
                            <p class="mb-0 text-dark font-weight-semibold">${p.instruction}</p>
                        </div>
                    </div>
                `).join('') : '<p class="text-muted">Direct online application available via portal URL.</p>';

            container.innerHTML = `
                <div class="container">
                    <div class="row g-4">
                        <!-- Main Details Column -->
                        <div class="col-lg-8">
                            <div class="card gov-card p-4 mb-4">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <span class="badge-category">${scheme.categoryName}</span>
                                    <span class="${scheme.schemeType === 'STATE' ? 'badge-state' : 'badge-central'}">${scheme.schemeType} SCHEME</span>
                                </div>
                                <h2 class="fw-bold mb-2">${scheme.schemeName}</h2>
                                <p class="text-primary fw-semibold mb-3"><i class="bi bi-building me-1"></i> ${scheme.department}</p>
                                <p class="lead text-dark mb-4">${scheme.shortDescription}</p>

                                <h5 class="fw-bold border-bottom pb-2 mb-3 text-primary"><i class="bi bi-award me-2"></i>Benefits & Provisions</h5>
                                <div class="bg-light p-3 rounded mb-4 border">
                                    <p class="mb-0 text-dark">${scheme.benefits}</p>
                                </div>

                                <h5 class="fw-bold border-bottom pb-2 mb-3 text-primary"><i class="bi bi-journal-text me-2"></i>Detailed Description</h5>
                                <p class="text-secondary mb-4" style="white-space: pre-line;">${scheme.description}</p>

                                <h5 class="fw-bold border-bottom pb-2 mb-3 text-primary"><i class="bi bi-file-earmark-check me-2"></i>Required Documents</h5>
                                <ul class="list-group mb-4 shadow-sm">
                                    ${docsHtml}
                                </ul>

                                <h5 class="fw-bold border-bottom pb-2 mb-3 text-primary"><i class="bi bi-list-ol me-2"></i>Application Procedure</h5>
                                <div class="bg-white p-3 rounded border mb-3">
                                    ${stepsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar Actions Column -->
                        <div class="col-lg-4">
                            <div class="card gov-card p-4 sticky-top" style="top: 100px;">
                                <h5 class="fw-bold mb-3">Quick Actions</h5>
                                <a href="recommendations.html?schemeId=${scheme.id}" class="btn btn-gov-primary w-100 mb-3 py-2">
                                    <i class="bi bi-cpu me-2"></i> Evaluate My Eligibility
                                </a>

                                ${scheme.applicationUrl ? `
                                    <a href="${scheme.applicationUrl}" target="_blank" class="btn btn-outline-success w-100 mb-3 py-2">
                                        <i class="bi bi-box-arrow-up-right me-2"></i> Official Application URL
                                    </a>
                                ` : ''}

                                <div class="border-top pt-3 mt-2">
                                    <h6 class="fw-bold text-muted small text-uppercase mb-2">Helpdesk & Support</h6>
                                    <p class="small text-dark mb-0"><i class="bi bi-telephone-fill text-primary me-2"></i>${scheme.contactInformation || 'Contact Department Toll-Free Helpline'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
