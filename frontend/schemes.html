<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Schemes - Government Scheme Recommendation System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-gov">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-bank2"></i></div>
                <div>GovScheme</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="schemes.html">Browse Schemes</a></li>
                    <li class="nav-item"><a class="nav-link" href="recommendations.html">Check Eligibility</a></li>
                </ul>
                <div id="nav-auth-section" class="d-flex align-items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <!-- HEADER SECTION -->
    <section class="bg-white py-4 border-bottom shadow-sm">
        <div class="container">
            <h2 class="fw-bold m-0"><i class="bi bi-grid-fill text-primary me-2"></i>Browse Government Schemes</h2>
            <p class="text-muted m-0">Search and filter active central and state government welfare schemes.</p>
        </div>
    </section>

    <!-- CONTENT SECTION -->
    <section class="py-5">
        <div class="container">
            <!-- Search & Filter Bar -->
            <div class="card gov-card mb-4 p-4 bg-white shadow-sm border">
                <div class="row g-3">
                    <div class="col-lg-4 col-md-6">
                        <label class="form-label small fw-bold text-muted mb-1"><i class="bi bi-search me-1"></i>Search Keyword</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control form-control-gov border-start-0" placeholder="e.g. scholarship, pension, health, farmer...">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label small fw-bold text-primary mb-1"><i class="bi bi-geo-alt-fill me-1"></i>Select State (Asks Your State)</label>
                        <select id="stateFilter" class="form-select form-control-gov border-primary">
                            <option value="">All States (Central + All States)</option>
                            <option value="CENTRAL_ONLY">Central Govt Schemes Only</option>
                            <option disabled>────────── Major States ──────────</option>
                            <option value="Tamil Nadu">Tamil Nadu</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Kerala">Kerala</option>
                            <option value="West Bengal">West Bengal</option>
                            <option value="Delhi">Delhi (NCT)</option>
                            <option value="Gujarat">Gujarat</option>
                            <option value="Andhra Pradesh">Andhra Pradesh</option>
                            <option value="Telangana">Telangana</option>
                            <option value="Bihar">Bihar</option>
                            <option value="Rajasthan">Rajasthan</option>
                            <option value="Madhya Pradesh">Madhya Pradesh</option>
                            <option value="Punjab">Punjab</option>
                            <option value="Haryana">Haryana</option>
                            <option value="Odisha">Odisha</option>
                            <option value="Assam">Assam</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label small fw-bold text-muted mb-1"><i class="bi bi-folder2-open me-1"></i>Category</label>
                        <select id="categoryFilter" class="form-select form-control-gov">
                            <option value="">All Categories</option>
                            <!-- Options populated via JS -->
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-6 d-flex align-items-end">
                        <button id="searchBtn" class="btn btn-gov-primary w-100 py-2"><i class="bi bi-funnel-fill me-1"></i> Filter</button>
                    </div>
                </div>

                <!-- Active Filter Status Indicator -->
                <div id="filterStatusBanner" class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2 small">
                    <div id="filterStatusText" class="text-muted">
                        <i class="bi bi-info-circle me-1 text-primary"></i> Showing all active Central and State schemes.
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="resetFiltersBtn">Reset Filters</button>
                    </div>
                </div>
            </div>

            <!-- Schemes List Grid -->
            <div class="row g-4" id="schemes-grid">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading government schemes...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-gov">
        <div class="container text-center small text-muted">
            &copy; 2026 Government Scheme Recommendation System
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialCategory = urlParams.get('category');
            const initialState = urlParams.get('state');

            const stateSelect = document.getElementById('stateFilter');
            if (initialState) {
                stateSelect.value = initialState;
            }

            // Populate categories dropdown
            try {
                const categories = await apiFetch('/schemes/categories');
                const catSelect = document.getElementById('categoryFilter');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    if (initialCategory && initialCategory == c.id) {
                        opt.selected = true;
                    }
                    catSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }

            // Load dynamically configured states if any new ones exist
            try {
                const availableStates = await apiFetch('/schemes/states');
                if (Array.isArray(availableStates)) {
                    const existingValues = Array.from(stateSelect.options).map(o => o.value);
                    availableStates.forEach(st => {
                        if (st && !existingValues.includes(st) && st !== 'ALL') {
                            const opt = document.createElement('option');
                            opt.value = st;
                            opt.textContent = st;
                            stateSelect.appendChild(opt);
                        }
                    });
                    if (initialState) {
                        stateSelect.value = initialState;
                    }
                }
            } catch (err) {
                console.warn('Could not load states list dynamically:', err.message);
            }

            fetchAndRenderSchemes();

            document.getElementById('searchBtn').addEventListener('click', fetchAndRenderSchemes);
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') fetchAndRenderSchemes();
            });
            document.getElementById('categoryFilter').addEventListener('change', fetchAndRenderSchemes);
            document.getElementById('stateFilter').addEventListener('change', fetchAndRenderSchemes);

            document.getElementById('resetFiltersBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('categoryFilter').value = '';
                document.getElementById('stateFilter').value = '';
                fetchAndRenderSchemes();
            });
        });

        async function fetchAndRenderSchemes() {
            const grid = document.getElementById('schemes-grid');
            const query = document.getElementById('searchInput').value.trim();
            const categoryId = document.getElementById('categoryFilter').value;
            const stateVal = document.getElementById('stateFilter').value;
            const filterBanner = document.getElementById('filterStatusText');

            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            `;

            try {
                let params = new URLSearchParams();
                let endpoint = '/schemes';

                if (categoryId) {
                    endpoint = `/schemes/category/${categoryId}`;
                } else if (query) {
                    endpoint = `/schemes/search`;
                    params.append('query', query);
                }

                if (stateVal && stateVal !== 'CENTRAL_ONLY') {
                    params.append('state', stateVal);
                }

                const url = params.toString() ? `${endpoint}?${params.toString()}` : endpoint;
                let schemes = await apiFetch(url);

                if (stateVal === 'CENTRAL_ONLY' && Array.isArray(schemes)) {
                    schemes = schemes.filter(s => s.schemeType === 'CENTRAL');
                }

                // Update status banner text
                if (stateVal && stateVal !== 'CENTRAL_ONLY') {
                    filterBanner.innerHTML = `<i class="bi bi-geo-alt-fill text-success me-1"></i> Showing <strong>Central Govt Schemes</strong> + <strong>${escapeHtml(stateVal)} State Schemes</strong> (${schemes ? schemes.length : 0} total found).`;
                } else if (stateVal === 'CENTRAL_ONLY') {
                    filterBanner.innerHTML = `<i class="bi bi-flag-fill text-primary me-1"></i> Showing <strong>Central Government Schemes Only</strong> (${schemes ? schemes.length : 0} total found).`;
                } else {
                    filterBanner.innerHTML = `<i class="bi bi-info-circle text-primary me-1"></i> Showing all active Central and State schemes (${schemes ? schemes.length : 0} total). Select your state above to filter!`;
                }

                if (!schemes || schemes.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
                            <h5 class="fw-bold">No Schemes Found</h5>
                            <p class="text-muted">Try selecting a different state, category, or clear search keywords.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = schemes.map(s => {
                    const isStateScheme = s.schemeType === 'STATE';
                    const stateLabel = s.state && s.state !== 'ALL' ? s.state : (isStateScheme ? 'State Scheme' : 'Central');
                    const badgeHtml = isStateScheme ?
                        `<span class="badge bg-warning text-dark px-2 py-1"><i class="bi bi-geo-alt-fill me-1"></i>${escapeHtml(stateLabel)} State Govt</span>` :
                        `<span class="badge bg-primary px-2 py-1"><i class="bi bi-flag-fill me-1"></i>Central Govt Scheme</span>`;

                    return `
                        <div class="col-md-6 col-lg-4">
                            <div class="card gov-card h-100 d-flex flex-column shadow-sm ${isStateScheme ? 'border-warning-subtle' : ''}">
                                <div class="gov-card-body flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-1">
                                        <span class="badge-category">${escapeHtml(s.categoryName)}</span>
                                        ${badgeHtml}
                                    </div>
                                    <h5 class="fw-bold text-dark mt-2 mb-2">${escapeHtml(s.schemeName)}</h5>
                                    <p class="text-muted small mb-3 text-truncate-3">${escapeHtml(s.shortDescription)}</p>
                                    <div class="bg-light p-2 rounded mb-3 border small">
                                        <i class="bi bi-building me-1 text-primary"></i> ${escapeHtml(s.department)}
                                    </div>
                                    ${s.state && s.state !== 'ALL' ? `
                                        <div class="mb-2 text-success small fw-semibold">
                                            <i class="bi bi-check-circle-fill me-1"></i> Applicable for residents of: <strong>${escapeHtml(s.state)}</strong>
                                        </div>
                                    ` : `
                                        <div class="mb-2 text-secondary small">
                                            <i class="bi bi-globe me-1"></i> Applicable for citizens across <strong>All India</strong>
                                        </div>
                                    `}
                                </div>
                                <div class="gov-card-footer d-flex justify-content-between align-items-center mt-auto border-top pt-3">
                                    <a href="scheme-detail.html?id=${s.id}" class="btn btn-gov-primary btn-sm">
                                        <i class="bi bi-eye me-1"></i> Details
                                    </a>
                                    <a href="recommendations.html?schemeId=${s.id}&state=${encodeURIComponent(s.state || '')}" class="btn btn-gov-outline btn-sm">
                                        <i class="bi bi-cpu me-1"></i> Check Eligibility
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div class="col-12 alert alert-danger text-center">
                        Failed to load schemes: ${err.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
