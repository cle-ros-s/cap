<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Schemes - Government Scheme Recommendation System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-gov">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-bank2"></i></div>
                <div>GovScheme</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="schemes.html">Browse Schemes</a></li>
                    <li class="nav-item"><a class="nav-link" href="recommendations.html">Check Eligibility</a></li>
                </ul>
                <div id="nav-auth-section" class="d-flex align-items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <!-- HEADER SECTION -->
    <section class="bg-white py-4 border-bottom shadow-sm">
        <div class="container">
            <h2 class="fw-bold m-0"><i class="bi bi-grid-fill text-primary me-2"></i>Browse Government Schemes</h2>
            <p class="text-muted m-0">Search and filter active central and state government welfare schemes.</p>
        </div>
    </section>

    <!-- CONTENT SECTION -->
    <section class="py-5">
        <div class="container">
            <!-- Search & Filter Bar -->
            <div class="card gov-card mb-4 p-3 bg-white">
                <div class="row g-3">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control form-control-gov" placeholder="Search by scheme name, department, or keyword...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="categoryFilter" class="form-select form-control-gov">
                            <option value="">All Categories</option>
                            <!-- Options populated via JS -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button id="searchBtn" class="btn btn-gov-primary w-100"><i class="bi bi-funnel-fill me-1"></i> Filter Schemes</button>
                    </div>
                </div>
            </div>

            <!-- Schemes List Grid -->
            <div class="row g-4" id="schemes-grid">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading government schemes...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-gov">
        <div class="container text-center small text-muted">
            &copy; 2026 Government Scheme Recommendation System
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialCategory = urlParams.get('category');

            // Populate categories dropdown
            try {
                const categories = await apiFetch('/schemes/categories');
                const catSelect = document.getElementById('categoryFilter');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    if (initialCategory && initialCategory == c.id) {
                        opt.selected = true;
                    }
                    catSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }

            fetchAndRenderSchemes();

            document.getElementById('searchBtn').addEventListener('click', fetchAndRenderSchemes);
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') fetchAndRenderSchemes();
            });
            document.getElementById('categoryFilter').addEventListener('change', fetchAndRenderSchemes);
        });

        async function fetchAndRenderSchemes() {
            const grid = document.getElementById('schemes-grid');
            const query = document.getElementById('searchInput').value.trim();
            const categoryId = document.getElementById('categoryFilter').value;

            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            `;

            try {
                let endpoint = '/schemes';
                if (categoryId) {
                    endpoint = `/schemes/category/${categoryId}`;
                } else if (query) {
                    endpoint = `/schemes/search?query=${encodeURIComponent(query)}`;
                }

                const schemes = await apiFetch(endpoint);
                if (!schemes || schemes.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
                            <h5 class="fw-bold">No Schemes Found</h5>
                            <p class="text-muted">Try adjusting your search query or category filter.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = schemes.map(s => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card gov-card">
                            <div class="gov-card-body">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="badge-category">${s.categoryName}</span>
                                    <span class="${s.schemeType === 'STATE' ? 'badge-state' : 'badge-central'}">${s.schemeType}</span>
                                </div>
                                <h5 class="fw-bold text-dark mt-2 mb-2">${s.schemeName}</h5>
                                <p class="text-muted small mb-3 text-truncate-3">${s.shortDescription}</p>
                                <div class="bg-light p-2 rounded mb-3 border small">
                                    <i class="bi bi-building me-1 text-primary"></i> ${s.department}
                                </div>
                            </div>
                            <div class="gov-card-footer d-flex justify-content-between align-items-center">
                                <a href="scheme-detail.html?id=${s.id}" class="btn btn-gov-primary btn-sm">
                                    <i class="bi bi-eye me-1"></i> Details
                                </a>
                                <a href="recommendations.html?schemeId=${s.id}" class="btn btn-gov-outline btn-sm">
                                    <i class="bi bi-cpu me-1"></i> Check Eligibility
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div class="col-12 alert alert-danger text-center">
                        Failed to load schemes: ${err.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
