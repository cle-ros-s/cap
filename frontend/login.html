<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Government Scheme Recommendation System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-gov position-fixed top-0 w-100">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-bank2"></i></div>
                <div>GovScheme</div>
            </a>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card gov-card p-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.6rem;"><i class="bi bi-lock-fill"></i></div>
                        <h3 class="fw-bold m-0">Sign In to Your Account</h3>
                        <p class="text-muted small mt-1">Access recommendations, saved bookmarks, and profile metrics</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold small">Email Address or Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" class="form-control form-control-gov" placeholder="user@gov.in or 9123456789" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control form-control-gov" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gov-primary w-100 py-2 fs-6">Sign In</button>
                        <div id="login-error" class="alert alert-danger mt-3 py-2 small d-none" role="alert"></div>
                    </form>

                    <!-- Quick Demo Credentials Box -->
                    <div class="bg-light p-3 rounded-3 mt-4 border text-start small">
                        <div class="fw-bold text-primary mb-1"><i class="bi bi-info-circle-fill me-1"></i> Demo Quick Login Credentials:</div>
                        <div class="d-flex justify-content-between mb-1">
                            <span><strong>Citizen Demo:</strong> user@gov.in</span>
                            <span class="text-muted">Pass: user123</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span><strong>Admin Demo:</strong> admin@gov.in</span>
                            <span class="text-muted">Pass: admin123</span>
                        </div>
                    </div>

                    <div class="text-center mt-4 border-top pt-3">
                        <span class="text-muted small">Don't have an account? </span>
                        <a href="register.html" class="fw-bold text-primary small">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
