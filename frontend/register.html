<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration - Government Scheme Recommendation System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Design Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-gov position-fixed top-0 w-100">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-bank2"></i></div>
                <div>GovScheme</div>
            </a>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card gov-card p-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.6rem;"><i class="bi bi-person-plus-fill"></i></div>
                        <h3 class="fw-bold m-0">Citizen Registration</h3>
                        <p class="text-muted small mt-1">Create an account to discover & save eligible government schemes</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold small">Full Name</label>
                            <input type="text" id="name" class="form-control form-control-gov" placeholder="e.g. Aditya Sharma" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-bold small">Email Address</label>
                                <input type="email" id="email" class="form-control form-control-gov" placeholder="ramesh@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label for="mobile" class="form-label fw-bold small">10-Digit Mobile Number</label>
                                <input type="tel" id="mobile" class="form-control form-control-gov" pattern="[0-9]{10}" placeholder="9876543210" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-bold small">Password</label>
                                <input type="password" id="password" class="form-control form-control-gov" placeholder="Minimum 6 characters" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-bold small">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control form-control-gov" placeholder="Repeat password" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gov-primary w-100 py-2 fs-6">Register Account</button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <span class="text-muted small">Already registered? </span>
                        <a href="login.html" class="fw-bold text-primary small">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
