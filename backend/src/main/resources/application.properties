# Server Configuration
server.port=8081
server.servlet.context-path=/

# Application Name
spring.application.name=Government Scheme Recommendation System

# H2 Database Configuration (Embedded, Zero Setup Required)
spring.datasource.url=jdbc:h2:file:./data/gov_scheme_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security & H2 Console compatibility
spring.headers.frame-options=sameorigin

# JWT Configuration
jwt.secret=9a2f8c4e7b1d4a6f8e3c5a7b9d2e4f6a8c1e3b5d7f9a2c4e6b8d0a2c4e6f8a0b
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=*
